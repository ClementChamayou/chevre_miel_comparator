# Empêche Supabase (offre gratuite) de mettre la base en pause après 7 jours sans activité.
# Lit l'URL et la clé publique directement dans config.js : rien à configurer.
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '17 6 */3 * *'   # tous les 3 jours, 6h17 UTC
  workflow_dispatch:          # bouton « Run workflow » pour tester à la main

permissions:
  actions: write              # pour réactiver ce workflow (voir dernière étape)
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" config.js)
          if [[ "$URL" == *XXXX* ]]; then echo "config.js pas encore rempli, rien à faire."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo

      # GitHub désactive les tâches planifiées d'un dépôt public après 60 jours sans commit.
      # Le réactiver à chaque passage est censé remettre ce compteur à zéro (méthode de l'action
      # « keepalive-workflow »). Si GitHub le désactive quand même, il prévient par mail : un clic suffit.
      - name: Rester actif
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
